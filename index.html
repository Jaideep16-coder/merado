<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEDORA — AI Health Copilot</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        sans: ['Plus Jakarta Sans', 'sans-serif']
      }
    }
  }
}
</script>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:'Plus Jakarta Sans',sans-serif;
  background:#f8fafc;
  color:#0f172a;
}
::-webkit-scrollbar{width:7px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px}

.modal-bg{
  background:rgba(15,23,42,.65);
  backdrop-filter:blur(6px);
}

.fade{
  animation:fade .35s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}

.card{
  background:white;
  border:1px solid #e2e8f0;
  border-radius:24px;
  box-shadow:0 10px 30px rgba(15,23,42,.05);
}

.gradient-text{
  background:linear-gradient(90deg,#059669,#0d9488);
  -webkit-background-clip:text;
  color:transparent;
}

.hero{
  background:linear-gradient(135deg,#0f172a,#134e4a);
}

.btn{
  transition:.2s;
}
.btn:hover{
  transform:translateY(-1px);
}

.toast{
  animation:toast .3s ease;
}

@keyframes toast{
  from{opacity:0;transform:translateY(15px)}
  to{opacity:1;transform:translateY(0)}
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-slate-200">
<div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">

  <button onclick="goHome()" class="flex items-center gap-3">
    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-600 to-teal-500 text-white flex items-center justify-center shadow">
      <i class="fa-solid fa-heart-pulse"></i>
    </div>

    <div class="text-left">
      <div class="font-extrabold text-lg">
        MEDORA
        <span class="text-[9px] bg-emerald-50 text-emerald-700 px-2 py-1 rounded-full">
          AI COPILOT
        </span>
      </div>
      <div class="hidden sm:block text-[10px] text-slate-500">
        Every medical record. One intelligent health story.
      </div>
    </div>
  </button>

  <div class="flex items-center gap-2">

    <button onclick="runDemo()"
      class="hidden sm:flex btn bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-bold">
      <i class="fa-solid fa-wand-magic-sparkles mr-2"></i>
      Run Demo
    </button>

    <button onclick="setLanguage('en')"
      id="enBtn"
      class="px-3 py-2 rounded-lg text-xs font-bold bg-slate-900 text-white">
      EN
    </button>

    <button onclick="setLanguage('hi')"
      id="hiBtn"
      class="px-3 py-2 rounded-lg text-xs font-bold bg-slate-100">
      हिन्दी
    </button>

    <button id="logoutBtn"
      onclick="logout()"
      class="hidden text-slate-500 hover:text-red-600 px-2">
      <i class="fa-solid fa-right-from-bracket"></i>
    </button>

  </div>
</div>
</header>


<!-- MAIN -->
<main id="app"></main>


<!-- FOOTER -->
<footer class="bg-white border-t border-slate-200 mt-16">
<div class="max-w-7xl mx-auto px-4 py-8 flex flex-col md:flex-row justify-between gap-5">

  <div>
    <h3 class="font-bold">MEDORA AI Healthcare Platform</h3>
    <p class="text-xs text-slate-500 mt-1">
      Every medical record. One intelligent health story.
    </p>
  </div>

  <div class="text-xs text-slate-500 max-w-xl">
    <b>Disclaimer:</b>
    MEDORA is an informational prototype and does not provide medical diagnosis
    or replace professional healthcare.
  </div>

</div>
</footer>


<!-- TOAST -->
<div id="toastBox"
class="fixed bottom-5 right-5 z-[100] space-y-2"></div>


<script>

/* =========================
   APP STATE
========================= */

let role = localStorage.getItem("medora_role") || null;
let language = localStorage.getItem("medora_lang") || "en";
let currentPage = "dashboard";


/* =========================
   DEMO DATA
========================= */

const patient = {
  name:"Alex Sharma",
  age:22,
  gender:"Male",
  blood:"B+",
  abha:"14-8920-5910-4821",

  conditions:[
    "Fever / Viral Syndrome",
    "Mild Dehydration"
  ],

  allergies:[
    "Penicillin (Mild Rash)"
  ],

  medicines:[
    {
      name:"Paracetamol",
      dose:"500 mg",
      frequency:"Twice daily",
      status:"Active"
    },
    {
      name:"Multivitamin",
      dose:"1 Tablet",
      frequency:"Once daily",
      status:"Active"
    }
  ],

  tests:[
    {
      name:"HbA1c",
      value:"7.2%",
      range:"4.0 – 5.6%",
      status:"Above reference range"
    },
    {
      name:"Body Temperature",
      value:"101.4°F",
      range:"97.0 – 99.0°F",
      status:"Elevated"
    }
  ]
};


/* =========================
   LANGUAGE
========================= */

function setLanguage(lang){

  language=lang;

  localStorage.setItem("medora_lang",lang);

  document.getElementById("enBtn").className =
    lang==="en"
    ?"px-3 py-2 rounded-lg text-xs font-bold bg-slate-900 text-white"
    :"px-3 py-2 rounded-lg text-xs font-bold bg-slate-100";

  document.getElementById("hiBtn").className =
    lang==="hi"
    ?"px-3 py-2 rounded-lg text-xs font-bold bg-slate-900 text-white"
    :"px-3 py-2 rounded-lg text-xs font-bold bg-slate-100";

  render();

  toast(
    lang==="hi"
    ?"भाषा हिंदी में बदल दी गई"
    :"Language switched to English",
    "success"
  );
}


/* =========================
   RENDER
========================= */

function render(){

  const app=document.getElementById("app");
  const logoutButton=document.getElementById("logoutBtn");

  if(role){
    logoutButton.classList.remove("hidden");
  }else{
    logoutButton.classList.add("hidden");
  }

  if(!role){
    app.innerHTML=landingPage();
    return;
  }

  if(role==="patient"){
    app.innerHTML=patientPortal();
    return;
  }

  if(role==="doctor"){
    app.innerHTML=doctorPortal();
  }
}


/* =========================
   LANDING PAGE
========================= */

function landingPage(){

return `
<div class="fade">

<section class="max-w-7xl mx-auto px-4 py-16">

<div class="text-center max-w-4xl mx-auto">

<div class="inline-flex items-center gap-2 bg-emerald-50 text-emerald-700 border border-emerald-200 px-4 py-2 rounded-full text-xs font-bold mb-5">
<i class="fa-solid fa-sparkles"></i>
AI-POWERED HEALTHCARE INTELLIGENCE
</div>

<h1 class="text-5xl md:text-6xl font-extrabold tracking-tight mb-5">
Your Health.
<span class="gradient-text">One Intelligent Story.</span>
</h1>

<p class="text-lg text-slate-600 leading-relaxed">
MEDORA transforms prescriptions, laboratory reports,
diagnostic records and healthcare information into one
simple and understandable health story.
</p>

</div>


<div class="grid md:grid-cols-2 gap-7 max-w-5xl mx-auto mt-14">


<!-- DOCTOR -->
<div class="card p-8 hover:shadow-xl transition">

<div class="w-16 h-16 rounded-2xl bg-teal-50 text-teal-600 flex items-center justify-center text-2xl mb-6">
<i class="fa-solid fa-user-doctor"></i>
</div>

<h2 class="text-2xl font-extrabold mb-2">
Doctor Portal
</h2>

<p class="text-sm text-slate-600 mb-7">
Review patient-shared health information,
understand medical history and prepare for consultations.
</p>

<button onclick="doctorLogin()"
class="btn w-full bg-slate-900 hover:bg-slate-800 text-white py-3.5 rounded-xl font-bold">
<i class="fa-solid fa-right-to-bracket mr-2"></i>
Doctor Login
</button>

</div>


<!-- PATIENT -->
<div class="card p-8 border-emerald-200 hover:shadow-xl transition">

<div class="w-16 h-16 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-2xl mb-6">
<i class="fa-solid fa-user"></i>
</div>

<h2 class="text-2xl font-extrabold mb-2">
Patient Portal
</h2>

<p class="text-sm text-slate-600 mb-7">
Understand your medical records, track changes,
manage health information and prepare for doctor conversations.
</p>

<button onclick="patientLogin()"
class="btn w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-xl font-bold">
<i class="fa-solid fa-right-to-bracket mr-2"></i>
Patient Login
</button>

</div>

</div>


<button onclick="runDemo()"
class="mt-10 bg-slate-100 hover:bg-slate-200 border border-slate-200 px-7 py-4 rounded-xl font-bold">
<i class="fa-solid fa-wand-magic-sparkles text-emerald-600 mr-2"></i>
Run Complete Hackathon Demo
</button>


<div class="grid grid-cols-2 md:grid-cols-4 gap-4 max-w-5xl mx-auto mt-14">

${feature("fa-file-medical","Medical Records")}
${feature("fa-brain","AI Insights")}
${feature("fa-timeline","Health Timeline")}
${feature("fa-user-doctor","Doctor Connect")}

</div>

</section>

<section class="hero text-white py-16">

<div class="max-w-6xl mx-auto px-4 text-center">

<h2 class="text-3xl font-extrabold mb-3">
Built for a smarter healthcare journey
</h2>

<p class="text-slate-300 max-w-2xl mx-auto">
From fragmented medical documents to an organized health story,
MEDORA helps people understand what changed and what to discuss
with healthcare professionals.
</p>

</div>

</section>

</div>
`;
}


function feature(icon,text){

return `
<div class="card p-5 text-center">
<div class="text-emerald-600 text-xl mb-2">
<i class="fa-solid ${icon}"></i>
</div>
<div class="text-xs font-bold">${text}</div>
</div>
`;
}


/* =========================
   LOGIN
========================= */

function patientLogin(){

showLogin("patient");
}

function doctorLogin(){

showLogin("doctor");
}


function showLogin(type){

const doctor=type==="doctor";

const modal=document.createElement("div");

modal.id="loginModal";

modal.className=
"fixed inset-0 z-[90] modal-bg flex items-center justify-center p-4";


modal.innerHTML=`

<div class="bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl fade">

<button onclick="closeLogin()"
class="float-right text-slate-400 hover:text-slate-800">
<i class="fa-solid fa-xmark text-xl"></i>
</button>

<div class="text-center mb-7">

<div class="w-14 h-14 mx-auto rounded-2xl
${doctor?"bg-teal-50 text-teal-600":"bg-emerald-50 text-emerald-600"}
flex items-center justify-center text-xl">

<i class="fa-solid ${doctor?"fa-user-doctor":"fa-user"}"></i>

</div>

<h2 class="text-2xl font-extrabold mt-4">
${doctor?"Doctor Portal Login":"Patient Login"}
</h2>

<p class="text-xs text-slate-500 mt-1">
Demo authentication for hackathon prototype
</p>

</div>


<form onsubmit="event.preventDefault();performLogin('${type}')"
class="space-y-4">

<div>

<label class="text-xs font-bold uppercase">
${doctor?"Doctor ID":"Email / Patient ID"}
</label>

<input
type="email"
required
value="${doctor?"doctor@medora.demo":"patient@medora.demo"}"
class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-emerald-500">

</div>


<div>

<label class="text-xs font-bold uppercase">
Password
</label>

<input
type="password"
required
value="${doctor?"doctor123":"medora123"}"
class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-emerald-500">

</div>


<div class="bg-slate-50 border rounded-xl p-3 text-xs">

<strong>Demo credentials</strong><br>

${doctor
?"doctor@medora.demo / doctor123"
:"patient@medora.demo / medora123"}

</div>


<button
class="w-full ${
doctor
?"bg-slate-900 hover:bg-slate-800"
:"bg-emerald-600 hover:bg-emerald-700"
} text-white py-3.5 rounded-xl font-bold">

Login as ${doctor?"Doctor":"Patient"}

</button>

</form>

</div>
`;

document.body.appendChild(modal);
}


function closeLogin(){

const modal=document.getElementById("loginModal");

if(modal) modal.remove();
}


function performLogin(type){

role=type;

localStorage.setItem("medora_role",role);

closeLogin();

currentPage="dashboard";

render();

toast(
`Logged in successfully as ${type.toUpperCase()}`,
"success"
);
}


/* =========================
   PATIENT PORTAL
========================= */

function patientPortal(){

return `

<div class="fade">

<!-- PATIENT NAV -->

<div class="bg-white border-b border-slate-200">

<div class="max-w-7xl mx-auto px-4 py-3 flex gap-2 overflow-x-auto">

${navButton("dashboard","fa-chart-pie","Dashboard")}

${navButton("records","fa-file-medical","Medical Records")}

${navButton("story","fa-timeline","Health Story")}

${navButton("copilot","fa-robot","AI Copilot")}

${navButton("consultation","fa-user-doctor","Consultation")}

${navButton("profile","fa-user","Health Profile")}

${navButton("abdm","fa-shield-halved","ABDM")}

</div>

</div>


<div class="max-w-7xl mx-auto px-4 py-8">

${patientPage()}

</div>

</div>
`;
}


function navButton(page,icon,text){

return `
<button
onclick="navigate('${page}')"
class="whitespace-nowrap px-4 py-2.5 rounded-xl text-sm font-bold
${currentPage===page
?"bg-emerald-600 text-white"
:"text-slate-600 hover:bg-slate-100"}">

<i class="fa-solid ${icon} mr-2"></i>
${text}

</button>
`;
}


function patientPage(){

switch(currentPage){

case "records":
return recordsPage();

case "story":
return storyPage();

case "copilot":
return copilotPage();

case "consultation":
return consultationPage();

case "profile":
return profilePage();

case "abdm":
return abdmPage();

default:
return dashboardPage();

}

}


/* =========================
   DASHBOARD
========================= */

return `

<div class="space-y-7">

<div class="hero rounded-3xl p-8 md:p-10 text-white">

/* =========================
   HEALTH STORY
========================= */

function storyPage(){

["12 Sept 2026","Prescription","Prescription Recorded",

</p>

</div>
`;
}

function sendAI(){

const input=document.getElementById("aiInput");

if(!input.value.trim()) return;

askAI(input.value);

input.value="";
}


function askAI(question){

let answer="I can help explain the information available in the demo records.";

const q=question.toLowerCase();

if(q.includes("hba1c")){

answer=
"The demo report shows HbA1c at 7.2%, while the displayed reference range is 4.0–5.6%. This is information to discuss with a qualified healthcare professional rather than a diagnosis.";

}

else if(q.includes("change")){

answer=
"The demo timeline shows prescription information, an HbA1c result, a diagnostic report and a recent AI health summary update.";

}

else if(q.includes("doctor")){

answer=
"You can discuss the fever information, the HbA1c result, your medicines, symptoms and any questions about follow-up with your healthcare professional.";

}

else if(q.includes("medicine")){

answer=
"Demo medicines: Paracetamol 500 mg — twice daily, and Multivitamin — once daily. This is fictional demo data.";

}

document.getElementById("aiAnswer").innerHTML=`

<div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-5 text-sm fade">

<div class="font-bold text-emerald-800 mb-2">
<i class="fa-solid fa-brain mr-2"></i>
MEDORA AI
</div>

${answer}

</div>

`;

}

========================= */

toast("Starting MEDORA automated demo...","success");

role="patient";

navigate("story");

toast("Step 1: Health Story opened","info");

},1800);


setTimeout(()=>{

toast("Step 2: Consultation workflow opened","info");

},3600);


setTimeout(()=>{

role="doctor";

localStorage.setItem("medora_role","doctor");

render();

toast("Step 3: Doctor Workspace loaded","success");

},5400);

}


/* =========================
   TOAST
========================= */

function toast(message,type="info"){

const box=document.getElementById("toastBox");

const el=document.createElement("div");

let bg="bg-slate-900";

if(type==="success") bg="bg-emerald-600";
if(type==="error") bg="bg-rose-600";
if(type==="warning") bg="bg-amber-600";

el.className=
`${bg} text-white px-5 py-3 rounded-xl shadow-xl text-sm font-semibold toast`;

el.innerHTML=`

<span>${message}</span>

<button onclick="this.parentElement.remove()" class="ml-4 opacity-70 hover:opacity-100">
<i class="fa-solid fa-xmark"></i>
</button>
`;

box.appendChild(el);

setTimeout(()=>{

el.style.opacity="0";

setTimeout(()=>el.remove(),300);

},4000);

}


/* =========================
   START APP
========================= */

render();

</script>
